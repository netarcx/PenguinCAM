name: CAM Integration Tests

# Every branch, not just the UV-CAM release branch: the point of CI is to catch a break
# before it reaches uvcam, and a check that never runs on the branch you are working on
# cannot.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-cam:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pygcode termcolor
          pip install -r requirements.txt

      # The same checks `make test` runs locally, which is what CLAUDE.md tells
      # every contributor to run before calling a change done. CI used to run only the
      # Fusion comparison, so a broken unit test, a physically impossible toolpath or a
      # JavaScript syntax error could all land on uvcam green.
      - name: Unit tests
        run: python -m unittest discover -s tests --buffer
        env:
          PYTHONIOENCODING: utf-8

      - name: G-code comparison against Fusion output
        run: python gcode_test.py --quiet
        env:
          PYTHONIOENCODING: utf-8

      - name: Validate feeds and speeds presets
        run: python validate_feeds_speeds.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Independent G-code audit
        run: python gcode_audit.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Browser JavaScript integrity
        run: |
          python check_js.py static/wizard.js static/multitool.js \
                             static/tube_designer.js static/gcode_viewer.js \
                             static/source_onshape.js static/bed_leveling.js
        env:
          PYTHONIOENCODING: utf-8

  deploy-up2:
    name: Deploy tested UV-CAM to UP2
    needs: test-cam
    if: github.event_name == 'push' && github.ref == 'refs/heads/uvcam'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: up2-production
      cancel-in-progress: false
    environment:
      name: up2-production
      url: https://cam.roemen.org
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout the tested revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      # A hosted runner cannot route to UP2's private 10.0.0.50 address. Workload
      # identity creates a short-lived, tag-restricted tailnet node for this job only.
      - name: Connect to the shop network
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:penguincam-deploy
          ping: 10.0.0.50

      - name: Configure pinned UP2 SSH identity
        env:
          UP2_SSH_PRIVATE_KEY: ${{ secrets.UP2_SSH_PRIVATE_KEY }}
          UP2_SSH_KNOWN_HOSTS: ${{ secrets.UP2_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$UP2_SSH_PRIVATE_KEY"
          test -n "$UP2_SSH_KNOWN_HOSTS"
          install -m 0700 -d "$HOME/.ssh"
          printf '%s\n' "$UP2_SSH_PRIVATE_KEY" > "$HOME/.ssh/up2-deploy"
          printf '%s\n' "$UP2_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/up2-deploy" "$HOME/.ssh/known_hosts"

      - name: Deploy, health-check, and roll back on failure
        env:
          UP2_DEPLOY_TARGET: root@10.0.0.50
        run: |
          UP2_SSH_KEY="$HOME/.ssh/up2-deploy" \
            bash scripts/deploy_up2.sh "$GITHUB_SHA"
